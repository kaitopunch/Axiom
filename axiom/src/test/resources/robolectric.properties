# Same reasoning as app/src/test/resources/robolectric.properties: this module's unit tests are given
# access to res/ (`isIncludeAndroidResources = true`), so Robolectric reads the manifest and takes its
# SDK from there. 34 is the newest android-all jar 4.14 ships; 36 is rejected outright.
sdk=34

# A bare Application. Nothing here wants the app graph — AxiomDatabase takes a Context for the database file
#, nothing more.
application=android.app.Application
