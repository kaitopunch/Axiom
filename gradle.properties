# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.enableJetifier=false
android.enableR8.fullMode=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ---- Axiom (the SDK under axiom/) ----
# Maven coordinates the :axiom module publishes under; read by gradle/axiom-publish.gradle.kts. The demo
# never publishes, but the module's build script applies that plugin unconditionally, so the three
# properties must exist. Credentials are NOT here: ~/.gradle/gradle.properties (`gpr.user` / `gpr.key`).
AXIOM_GROUP=com.axiom
AXIOM_VERSION=0.1.0
AXIOM_GITHUB_REPO=duylt-dev/axiom
