# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.enableJetifier=false
android.enableR8.fullMode=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ---- Axiom (the SDK under axiom/) ----
# Maven coordinates the :axiom module publishes under; read by gradle/axiom-publish.gradle.kts.
#
# The public channel is JitPack (jitpack.yml at the root): it builds a git tag of AXIOM_GITHUB_REPO and
# publishes the result as `com.github.kaitopunch:Axiom:<tag>`, rewriting group and version from
# the tag — so AXIOM_GROUP / AXIOM_VERSION only name what a *local* `publishToMavenLocal` produces, and
# the release tag must equal AXIOM_VERSION (tag `1.0.0`, not `v1.0.0`). GitHub Packages
# (`:axiom:publish`) is kept as a fallback; its credentials are NOT here: ~/.gradle/gradle.properties
# (`gpr.user` / `gpr.key`).
AXIOM_GROUP=com.axiom
AXIOM_VERSION=1.0.0
AXIOM_GITHUB_REPO=kaitopunch/Axiom
